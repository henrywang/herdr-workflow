name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      # Unit tests must pass with no herdr installed -- that is the contract that lets a
      # contributor start in minutes.
      - run: just test
      - run: just build
