[project]
name = "herdr-workflow"
version = "0.1.1"
description = "Opinionated multi-agent plan/build/review/ship workflows for herdr"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Henry Wang" }]
keywords = ["herdr", "agents", "workflow", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "typer>=0.15",
    "msgspec>=0.19",
]

[project.scripts]
wq = "herdr_workflow.__main__:main"

[project.urls]
Homepage = "https://github.com/henrywang/herdr-workflow"
Repository = "https://github.com/henrywang/herdr-workflow"
Issues = "https://github.com/henrywang/herdr-workflow/issues"
Changelog = "https://github.com/henrywang/herdr-workflow/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_workflow"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running herdr daemon (deselect with -m 'not integration')",
]
